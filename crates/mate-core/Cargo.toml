[package]
name = "mate-core"
version = "0.9.0"
edition = "2024"
rust-version = "1.90"

[lib]
name = "mate_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
infer = { version = "0.19", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
base64 = "0.22"
url = "2"
lz4_flex = { version = "0.11", default-features = false, features = ["safe-decode"] }
# OneNote sections/notebooks (MPL-2.0, used unmodified). No `native-fs`: Mate parses from memory.
onenote_parser = { version = "2.1", default-features = false, features = ["onepkg"] }
# Read directly only to check a `.onepkg` cabinet's declared sizes before it is unpacked.
cab = "0.6"
# `onenote_parser` takes its file names as `TypedPath`s.
typed-path = "0.12"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[target.'cfg(windows)'.dependencies]
# Volume labels for synced-folder detection (share/folders.rs). Same version src-tauri uses.
windows = { version = "0.62.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
# Writes the keyed-archive fixtures in tests/import_notability.rs (the importer reads bplists itself).
plist = "1"
