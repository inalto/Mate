name: release

# Builds installers for Windows, macOS (Apple Silicon + Intel) and Linux, plus a signed Android APK,
# and attaches them to a GitHub Release. Triggered by pushing a tag such as v0.1.0,
# or manually from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Creates the GitHub Release once, as a draft, so the build jobs only upload to it and
  # "latest" keeps pointing at the previous release (and its latest.json) until every installer
  # is attached. Without this step two jobs finishing at the same moment both try to create it
  # and one fails.
  prepare:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    steps:
      - name: Create the release if it does not exist yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "Mate ${TAG#v}" --notes "$(cat <<'NOTES'
          Mate — local-first handwriting & math notes for Windows, macOS, Linux and Android tablets.

          Installers: `.msi` / `-setup.exe` (Windows), `.dmg` (macOS, Apple Silicon and Intel), `.deb` / `.rpm` / `.AppImage` (Linux), `_aarch64.apk` (Android tablets, sideload).
          macOS builds are not notarised yet: right-click → Open the first time, or run `xattr -dr com.apple.quarantine /Applications/Mate.app`.
          NOTES
          )"
          fi

  release:
    needs: prepare
    # workflow_dispatch skips prepare; the build jobs then create the release themselves as before.
    if: always() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target aarch64-apple-darwin"
          - os: macos-latest
            args: "--target x86_64-apple-darwin"
          - os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    env:
      # Only whether the secret exists; the key itself is passed to the tauri-action step alone.
      HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libdbus-1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.args, 'aarch64-apple-darwin') && 'aarch64-apple-darwin' || contains(matrix.args, 'x86_64-apple-darwin') && 'x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2

      - run: npm ci

      - name: Skip updater artifacts when no signing key is configured
        if: env.HAS_SIGNING_KEY != 'true'
        run: node -e "const f='src-tauri/tauri.conf.json',fs=require('fs'),c=JSON.parse(fs.readFileSync(f,'utf8'));c.bundle.createUpdaterArtifacts=false;fs.writeFileSync(f,JSON.stringify(c,null,2))"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # One-time setup: see README "Updates". Without the key, installers still build, unsigned and without updater artifacts.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "Mate v__VERSION__"
          releaseBody: |
            Mate — local-first handwriting & math notes for Windows, macOS, Linux and Android tablets.

            Installers: `.msi` / `-setup.exe` (Windows), `.dmg` (macOS, Apple Silicon and Intel), `.deb` / `.rpm` / `.AppImage` (Linux), `_aarch64.apk` (Android tablets, sideload).
            macOS builds are not notarised yet: right-click → Open the first time, or run `xattr -dr com.apple.quarantine /Applications/Mate.app`.
          # The release is created as a draft by `prepare` and published by `publish` below.
          releaseDraft: true
          prerelease: false
          # Uploads latest.json (versions, signatures, URLs) next to the installers when signing is on.
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # Builds the signed Android APK (64-bit ARM) and attaches it to the same draft release.
  # One-time setup: see README "Android signing". Without ANDROID_KEYSTORE_BASE64 the job still
  # succeeds but skips every build step, so `publish` is never held up by it.
  android:
    needs: prepare
    if: always() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      # Secrets cannot be read in a job-level `if`, so this step turns "is the secret set" into an output.
      - name: Check for the Android keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANDROID_KEYSTORE_BASE64 is not set; skipping the Android build."
          fi

      - uses: actions/checkout@v4
        if: steps.keystore.outputs.has_keystore == 'true'

      - uses: actions/setup-java@v4
        if: steps.keystore.outputs.has_keystore == 'true'
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        if: steps.keystore.outputs.has_keystore == 'true'
        with:
          # The app compiles against 37; plugin libraries are raised to 36 (root build.gradle.kts).
          packages: "ndk;27.2.12479018 platforms;android-35 platforms;android-36 platforms;android-37.0 build-tools;35.0.1"

      - name: Point NDK_HOME at the installed NDK
        if: steps.keystore.outputs.has_keystore == 'true'
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        if: steps.keystore.outputs.has_keystore == 'true'
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        if: steps.keystore.outputs.has_keystore == 'true'
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        if: steps.keystore.outputs.has_keystore == 'true'

      - run: npm ci
        if: steps.keystore.outputs.has_keystore == 'true'

      # The keystore goes outside the checkout; key.properties (gitignored) is read by app/build.gradle.kts.
      - name: Write the signing config
        if: steps.keystore.outputs.has_keystore == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mate-android.jks"
          {
            echo "storeFile=$RUNNER_TEMP/mate-android.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > src-tauri/gen/android/key.properties

      - name: Build the APK
        if: steps.keystore.outputs.has_keystore == 'true'
        run: npm run tauri android build -- --apk --target aarch64

      - name: Upload the APK
        if: steps.keystore.outputs.has_keystore == 'true'
        id: apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
          TAG: ${{ github.ref_name }}
        run: |
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-release.apk' | head -n 1)
          [ -n "$apk" ] || { echo "no release APK was built"; exit 1; }
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          out="$RUNNER_TEMP/Mate_${version}_aarch64.apk"
          cp "$apk" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"
          if [ "$IS_TAG" = "true" ]; then
            gh release upload "$TAG" "$out" --repo "$GITHUB_REPOSITORY" --clobber
          fi

      # workflow_dispatch has no release to attach to; keep the APK as a workflow artifact instead.
      - uses: actions/upload-artifact@v4
        if: steps.keystore.outputs.has_keystore == 'true' && github.ref_type != 'tag'
        with:
          name: mate-android-apk
          path: ${{ steps.apk.outputs.path }}

  # Builds the iPad .ipa (App Store Connect export) and attaches it to the same draft release.
  # One-time setup: see README "iOS signing". Without IOS_CERTIFICATE the job still succeeds but
  # skips every build step, which `publish` accepts, but a failing build holds the release back. Uploading the .ipa to TestFlight
  # is a manual Transporter / `xcrun altool` step for now.
  ios:
    needs: prepare
    if: always() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    runs-on: macos-15
    steps:
      # Secrets cannot be read in a job-level `if`, so this step turns "is the secret set" into an output.
      - name: Check for iOS signing
        id: signing
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
        run: |
          if [ -n "$IOS_CERTIFICATE" ]; then
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
            echo "::notice::IOS_CERTIFICATE is not set; skipping the iOS build."
          fi

      - uses: actions/checkout@v4
        if: steps.signing.outputs.has_signing == 'true'

      - uses: actions/setup-node@v4
        if: steps.signing.outputs.has_signing == 'true'
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        if: steps.signing.outputs.has_signing == 'true'
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: swatinem/rust-cache@v2
        if: steps.signing.outputs.has_signing == 'true'

      - run: npm ci
        if: steps.signing.outputs.has_signing == 'true'

      # Temporary keychain for the distribution certificate, the provisioning profile where Xcode
      # looks for it, and the App Store Connect API key for the export.
      - name: Import the certificate and profile
        if: steps.signing.outputs.has_signing == 'true'
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$IOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/ios.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/ios.p12" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          echo "$IOS_MOBILE_PROVISION" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          uuid=$(grep -a -A1 UUID "$RUNNER_TEMP/profile.mobileprovision" | grep -Eio '[0-9a-f]{8}-[0-9a-f-]{27}' | head -n 1)
          [ -n "$uuid" ] || { echo "no UUID found in the provisioning profile"; exit 1; }
          # Xcode 16 reads profiles from either folder.
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/profile.mobileprovision" "$dir/$uuid.mobileprovision"
          done

          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build the IPA
        if: steps.signing.outputs.has_signing == 'true'
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: npm run tauri ios build -- --export-method app-store-connect

      - name: Upload the IPA
        if: steps.signing.outputs.has_signing == 'true'
        id: ipa
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
          TAG: ${{ github.ref_name }}
        run: |
          ipa=src-tauri/gen/apple/build/arm64/Mate.ipa
          [ -f "$ipa" ] || { echo "no IPA was built"; exit 1; }
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          out="$RUNNER_TEMP/Mate_${version}_ios.ipa"
          cp "$ipa" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"
          if [ "$IS_TAG" = "true" ]; then
            gh release upload "$TAG" "$out" --repo "$GITHUB_REPOSITORY" --clobber
          fi

      # workflow_dispatch has no release to attach to; keep the IPA as a workflow artifact instead.
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.has_signing == 'true' && github.ref_type != 'tag'
        with:
          name: mate-ios-ipa
          path: ${{ steps.ipa.outputs.path }}

  # Publishes the draft only when all four desktop builds uploaded their installers, so updaters
  # never see a release without latest.json. The Android and iOS jobs must not have failed; when they
  # have no signing secrets they succeed with their steps skipped, and a skipped job does not hold the release back.
  publish:
    needs: [prepare, release, android, ios]
    if: >-
      always() && github.ref_type == 'tag' && needs.release.result == 'success' &&
      (needs.android.result == 'success' || needs.android.result == 'skipped') &&
      (needs.ios.result == 'success' || needs.ios.result == 'skipped')
    runs-on: ubuntu-22.04
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -q '^latest.json$' || { echo "latest.json missing; leaving the release as a draft"; exit 1; }
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
