[package]
name = "mate"
version = "0.6.0"
description = "Mate"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "mate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
mate-core = { path = "../crates/mate-core" }
base64 = "0.22"
tokio = { version = "1", features = ["sync", "time"] }
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "zip"] }
semver = "1"
tauri-plugin-clipboard-manager = "2"
time = { version = "0.3", features = ["macros", "local-offset"] }

[target.'cfg(windows)'.dependencies]
# Pen haptics (commands/haptics.rs). Same version tauri/webview2 already pull in.
windows = { version = "0.62.2", features = ["Foundation", "Foundation_Collections", "Devices_Haptics", "Devices_Input"] }
